[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "squeal"
version = "0.1.0"
description = "A SQL query engine from scratch in pure Python, zero dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "TheRealAlexxx"}]
keywords = ["sql", "database", "query-engine", "csv", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.scripts]
squeal = "squeal.cli:main"

[tool.setuptools.packages.find]
include = ["squeal*"]
