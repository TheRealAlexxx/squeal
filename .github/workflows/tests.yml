name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    strategy:
      matrix:
        include:
          # 3.9 stays on the 22.04 image: the Ubuntu 26.04 runner image has
          # no Python 3.9 build, and the declared support floor is 3.9.
          - { python-version: "3.9", os: "ubuntu-22.04" }
          - { python-version: "3.10", os: "ubuntu-latest" }
          - { python-version: "3.11", os: "ubuntu-latest" }
          - { python-version: "3.12", os: "ubuntu-latest" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: run the suite
        run: PYTHONPATH=. python -m unittest discover -s tests
